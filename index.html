<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candela</title>
    <style>
      canvas {
        max-width: 100%;
        height: auto;
      }

      /* Lightroom-style slider: filled bar grows from center (0) toward
         the thumb, instead of the browser default fill-from-left-edge. */
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          #ccc 0%,
          #ccc var(--from, 50%),
          #4a90d9 var(--from, 50%),
          #4a90d9 var(--to, 50%),
          #ccc var(--to, 50%),
          #ccc 100%
        );
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #4a90d9;
        cursor: pointer;
      }
      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        background: #4a90d9;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <label for="file">Raw file</label>
      <input type="file" id="file" accept=".dng,.nef,.cr3,.arw,.raf" />
      <canvas id="canvas"></canvas>
      <label>Exposure <input type="range" id="exposure" min="-3" max="3" step="0.1" value="0" /></label>
      <label>White balance <input type="range" id="wb" min="-1" max="1" step="0.05" value="0" /></label>
      <p id="error" role="alert"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
