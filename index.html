<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candela</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e20;
        --panel: #26262a;
        --panel-border: #3a3a3f;
        --text: #cfcfcf;
        --text-dim: #8a8a90;
        --accent: #7db2ff;
        --thumb-bg: #333338;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, sans-serif;
      }

      /* Lightroom-style slider: filled bar grows from center (0) toward
         the thumb, instead of the browser default fill-from-left-edge. */
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          #444 0%,
          #444 var(--from, 50%),
          #4a90d9 var(--from, 50%),
          #4a90d9 var(--to, 50%),
          #444 var(--to, 50%),
          #444 100%
        );
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #4a90d9;
        cursor: pointer;
      }
      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        background: #4a90d9;
        cursor: pointer;
      }

      /* ---- five-region shell ---- */
      #app {
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        grid-template-rows: auto 1fr 84px;
        height: 100vh;
      }
      #topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
      }
      #topbar button {
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      #topbar button.active {
        background: #3d3d43;
        color: #fff;
      }
      #brand {
        margin-left: auto;
        color: var(--accent);
        font-weight: 600;
      }

      /* Module sections occupy the middle row; each lays out its own
         left/content/right columns. `[hidden]` must beat `.module`'s
         display:grid -- UA default is weaker than author styles. */
      .module {
        grid-column: 1 / -1;
        grid-row: 2;
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        min-height: 0;
      }
      .module[hidden] {
        display: none;
      }
      .module .panel {
        background: var(--panel);
        overflow-y: auto;
        padding: 10px;
      }
      .module .panel.left {
        border-right: 1px solid var(--panel-border);
      }
      .module .panel.right {
        border-left: 1px solid var(--panel-border);
      }
      .module .content {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
        background: var(--bg);
      }
      .panel-title {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }

      /* ---- Library: folders + grid + metadata ---- */
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .panel-header .panel-title {
        margin-bottom: 0;
      }
      #add-folder {
        background: none;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 4px;
        padding: 1px 8px;
        cursor: pointer;
        font: inherit;
      }
      .folder-row {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
      }
      .folder-row:hover {
        background: #2f2f34;
        color: var(--text);
      }
      .folder-row.active {
        background: #3a4a5c;
        color: #fff;
      }

      #library-scroll {
        height: 100%;
        overflow-y: auto;
        position: relative;
      }
      #library-grid {
        position: relative;
        width: 100%;
      }
      .catalog-heading {
        position: absolute;
        left: 0;
        right: 0;
        height: 24px;
        padding: 3px 8px;
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .catalog-row {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        gap: 4px;
      }
      .catalog-cell {
        width: 160px;
        height: 160px;
        background: var(--thumb-bg);
        cursor: pointer;
        overflow: hidden;
        flex-shrink: 0;
        border-radius: 2px;
      }
      .catalog-cell.selected {
        outline: 2px solid var(--accent);
      }
      .catalog-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        font-size: 12px;
      }
      .meta-label {
        color: var(--text-dim);
      }
      .meta-value {
        text-align: right;
        word-break: break-word;
      }

      /* ---- Develop: history + loupe + Basic ---- */
      #canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .history-row {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-row:hover {
        background: #2f2f34;
        color: var(--text);
      }
      .history-row.active {
        background: #3a4a5c;
        color: #fff;
      }
      .history-buttons {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .history-buttons button {
        flex: 1;
        background: none;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
      }
      .history-buttons button:hover {
        background: #2f2f34;
      }
      .slider-label {
        display: block;
        font-size: 12px;
        margin: 10px 0 2px;
      }
      .slider-label output {
        float: right;
        color: var(--accent);
      }

      /* ---- shared filmstrip ---- */
      #filmstrip {
        grid-column: 1 / -1;
        grid-row: 3;
        background: var(--panel);
        border-top: 1px solid var(--panel-border);
        overflow-x: auto;
        overflow-y: hidden;
        position: relative;
      }
      #filmstrip-track {
        position: relative;
        height: 100%;
      }
      .filmstrip-cell {
        position: absolute;
        top: 9px;
        width: 96px;
        height: 66px;
        background: var(--thumb-bg);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
      }
      .filmstrip-cell.selected {
        outline: 2px solid var(--accent);
      }
      .filmstrip-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ---- error toast ---- */
      #error {
        position: fixed;
        bottom: 96px;
        left: 12px;
        z-index: 10;
        max-width: 480px;
        background: #5a2226;
        border: 1px solid #7a3236;
        border-radius: 6px;
        padding: 10px 14px;
      }
      #error[hidden] {
        display: none;
      }
      #error-message {
        margin: 0 0 4px;
      }
      #error-detail {
        margin: 0;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #e0b0b0;
      }
      #error summary {
        cursor: pointer;
        font-size: 11px;
        color: #e0b0b0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button data-module="library" class="active">Library</button>
        <button data-module="develop">Develop</button>
        <span id="brand">Candela</span>
      </header>

      <section id="module-library" class="module">
        <aside class="panel left">
          <div class="panel-header">
            <h2 class="panel-title">Folders</h2>
            <button id="add-folder" title="Add folder">＋</button>
          </div>
          <div id="folder-list"></div>
        </aside>
        <main class="content">
          <div id="library-scroll">
            <div id="library-grid"></div>
          </div>
        </main>
        <aside class="panel right">
          <h2 class="panel-title">Metadata</h2>
          <div id="metadata-panel"></div>
        </aside>
      </section>

      <section id="module-develop" class="module" hidden>
        <aside class="panel left">
          <h2 class="panel-title">History</h2>
          <div id="history-list"></div>
          <div class="history-buttons">
            <button id="undo-btn">Undo</button>
            <button id="redo-btn">Redo</button>
          </div>
        </aside>
        <main class="content">
          <canvas id="canvas"></canvas>
        </main>
        <aside class="panel right">
          <h2 class="panel-title">Basic</h2>
          <label class="slider-label" for="exposure">Exposure <output id="exposure-value" for="exposure">+0.00</output></label>
          <input type="range" id="exposure" min="-3" max="3" step="0.01" value="0" />
          <label class="slider-label" for="wb">White Balance <output id="wb-value" for="wb">5500K</output></label>
          <input type="range" id="wb" min="2000" max="10000" step="50" value="5500" />
        </aside>
      </section>

      <footer id="filmstrip">
        <div id="filmstrip-track"></div>
      </footer>

      <div id="error" role="alert" hidden>
        <p id="error-message"></p>
        <details>
          <summary>See detail</summary>
          <pre id="error-detail"></pre>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
