<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candela</title>
    <style>
      canvas {
        max-width: 100%;
        height: auto;
      }

      /* Lightroom-style slider: filled bar grows from center (0) toward
         the thumb, instead of the browser default fill-from-left-edge. */
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          #ccc 0%,
          #ccc var(--from, 50%),
          #4a90d9 var(--from, 50%),
          #4a90d9 var(--to, 50%),
          #ccc var(--to, 50%),
          #ccc 100%
        );
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #4a90d9;
        cursor: pointer;
      }
      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        background: #4a90d9;
        cursor: pointer;
      }

      #error-detail {
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <button id="add-folder">Add folder</button>
      <ul id="catalog-list"></ul>
      <canvas id="canvas"></canvas>
      <label>Exposure <input type="range" id="exposure" min="-3" max="3" step="0.01" value="0" /> <output id="exposure-value" for="exposure">0.00</output></label>
      <label>White balance <input type="range" id="wb" min="2000" max="10000" step="50" value="5500" /> <output id="wb-value" for="wb">5500K</output></label>
      <div id="error" role="alert" hidden>
        <p id="error-message"></p>
        <details>
          <summary>See detail</summary>
          <pre id="error-detail"></pre>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
