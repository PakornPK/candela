<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candela</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1e1e20;
        --panel: #26262a;
        --panel-border: #3a3a3f;
        --text: #cfcfcf;
        --text-dim: #8a8a90;
        --accent: #7db2ff;
        --thumb-bg: #333338;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, sans-serif;
      }

      /* Lightroom-style slider: filled bar grows from center (0) toward
         the thumb, instead of the browser default fill-from-left-edge. */
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          #444 0%,
          #444 var(--from, 50%),
          #4a90d9 var(--from, 50%),
          #4a90d9 var(--to, 50%),
          #444 var(--to, 50%),
          #444 100%
        );
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #4a90d9;
        cursor: pointer;
      }
      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: none;
        background: #4a90d9;
        cursor: pointer;
      }

      /* ---- five-region shell ---- */
      #app {
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        grid-template-rows: auto 1fr 84px;
        height: 100vh;
      }
      #topbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
      }
      #topbar button {
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      #topbar button.active {
        background: #3d3d43;
        color: #fff;
      }
      #brand {
        margin-left: auto;
        color: var(--accent);
        font-weight: 600;
      }

      /* Module sections occupy the middle row; each lays out its own
         left/content/right columns. `[hidden]` must beat `.module`'s
         display:grid -- UA default is weaker than author styles. */
      .module {
        grid-column: 1 / -1;
        grid-row: 2;
        display: grid;
        grid-template-columns: 220px 1fr 260px;
        min-height: 0;
      }
      .module[hidden] {
        display: none;
      }
      .module .panel {
        background: var(--panel);
        overflow-y: auto;
        padding: 10px;
      }
      .module .panel.left {
        border-right: 1px solid var(--panel-border);
      }
      .module .panel.right {
        border-left: 1px solid var(--panel-border);
      }
      .module .content {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        position: relative;
        background: var(--bg);
      }
      .panel-title {
        margin: 0 0 8px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }

      /* ---- Library: folders + grid + metadata ---- */
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .panel-header .panel-title {
        margin-bottom: 0;
      }
      #add-folder {
        background: none;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 4px;
        padding: 1px 8px;
        cursor: pointer;
        font: inherit;
      }
      .folder-row {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
      }
      .folder-row:hover {
        background: #2f2f34;
        color: var(--text);
      }
      .folder-row.active {
        background: #3a4a5c;
        color: #fff;
      }

      #library-scroll {
        height: 100%;
        overflow-y: auto;
        position: relative;
      }
      #library-grid {
        position: relative;
        width: 100%;
      }
      .catalog-heading {
        position: absolute;
        left: 0;
        right: 0;
        height: 24px;
        padding: 3px 8px;
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .catalog-row {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        gap: 4px;
      }
      .catalog-cell {
        position: relative; /* cull badges overlay the thumbnail */
        width: 160px;
        height: 160px;
        background: var(--thumb-bg);
        cursor: pointer;
        overflow: hidden;
        flex-shrink: 0;
        border-radius: 2px;
      }
      .catalog-cell.selected {
        outline: 2px solid var(--accent);
      }
      .cell-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 18px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        border-radius: 2px;
        font-size: 12px;
        color: #fff;
        z-index: 1;
      }
      .cell-badge-reject { background: #d33; }
      .cell-badge-pick { background: #2a8; }
      .cell-rating {
        position: absolute;
        bottom: 2px;
        left: 4px;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        font-size: 11px;
        letter-spacing: 1px;
        z-index: 1;
      }
      .cell-color {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        z-index: 1;
      }
      .cell-color-1 { background: #e33; }
      .cell-color-2 { background: #ec3; }
      .cell-color-3 { background: #3c3; }
      .cell-color-4 { background: #38f; }
      .cull-filter {
        padding: 8px 12px;
        border-top: 1px solid var(--panel-border);
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .cull-filter-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cull-filter select {
        font-size: 12px;
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--panel-border);
        border-radius: 2px;
      }
      .catalog-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
        font-size: 12px;
      }
      .meta-label {
        color: var(--text-dim);
      }
      .meta-value {
        text-align: right;
        word-break: break-word;
      }

      /* ---- Develop: history + loupe + Basic ---- */
      #canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      /* Embedded-JPEG preview fallback: an <img> layered over #canvas (which
         owns the WebGPU surface -- a canvas can't host 2D and WebGPU at
         once). `.content` is position:relative, so absolute inset:0 fills the
         loupe region. Shown only when the raw decode fails or is garbage. */
      .preview-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--bg);
      }
      .preview-overlay[hidden],
      .preview-note[hidden] {
        display: none;
      }
      .preview-note {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.65);
        color: var(--text);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
      }
      .history-row {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-dim);
        font: inherit;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-row:hover {
        background: #2f2f34;
        color: var(--text);
      }
      .history-row.active {
        background: #3a4a5c;
        color: #fff;
      }
      .history-buttons {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .history-buttons button {
        flex: 1;
        background: none;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
      }
      .history-buttons button:hover {
        background: #2f2f34;
      }
      #preset-save {
        width: 100%;
        margin: 6px 0;
        background: none;
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      #preset-save:hover {
        background: #2f2f34;
      }
      #preset-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .preset-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 3px 6px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        overflow: hidden;
      }
      .preset-row:hover {
        background: #2f2f34;
      }
      .preset-row span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preset-row button {
        background: none;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
        padding: 0 2px;
        opacity: 0.6;
      }
      .preset-row button:hover {
        opacity: 1;
      }
      .slider-label {
        display: block;
        font-size: 12px;
        margin: 10px 0 2px;
      }
      .slider-label output {
        float: right;
        color: var(--accent);
      }
      .curve-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        margin: 10px 0 2px;
      }
      .curve-header button {
        font-size: 11px;
        padding: 1px 8px;
      }
      .curve-header .adjust-label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .curve-header select {
        font-size: 11px;
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--panel-border);
        border-radius: 2px;
      }
      #curve-region[hidden],
      #curve-point[hidden] {
        display: none;
      }
      #curve {
        display: block;
        width: 100%;
        height: auto;
        background: #2a2a2e;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        cursor: crosshair;
        touch-action: none;
      }
      .export-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
      }
      .export-row select {
        flex: 1;
        font-size: 12px;
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--panel-border);
        border-radius: 2px;
      }
      /* Lightroom-style collapsible Develop sections. */
      .panel-section {
        margin-bottom: 4px;
        border-top: 1px solid var(--panel-border);
        padding-top: 2px;
      }
      .panel-section summary {
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        padding: 6px 0 2px;
        user-select: none;
      }
      .panel-section summary:hover {
        color: var(--text);
      }
      #histogram {
        display: block;
        width: 100%;
        height: auto;
        background: #2a2a2e;
        border: 1px solid var(--panel-border);
        border-radius: 3px;
        margin-bottom: 4px;
      }
      /* LrC-style shooting-info line (SO 320 · 23 mm · f/2.8 · 1/140 sec). */
      .camera-info {
        display: block;
        padding: 4px 2px;
        font-size: 11px;
        color: var(--text-dim);
        text-align: center;
        min-height: 16px;
        line-height: 16px;
      }
      #profile {
        width: 100%;
        font-size: 12px;
        background: var(--panel);
        color: inherit;
        border: 1px solid var(--panel-border);
        border-radius: 2px;
      }

      /* ---- shared filmstrip ---- */
      #filmstrip {
        grid-column: 1 / -1;
        grid-row: 3;
        background: var(--panel);
        border-top: 1px solid var(--panel-border);
        overflow-x: auto;
        overflow-y: hidden;
        position: relative;
      }
      #filmstrip-track {
        position: relative;
        height: 100%;
      }
      .filmstrip-cell {
        position: absolute;
        top: 9px;
        width: 96px;
        height: 66px;
        background: var(--thumb-bg);
        border-radius: 2px;
        cursor: pointer;
        overflow: hidden;
      }
      .filmstrip-cell.selected {
        outline: 2px solid var(--accent);
      }
      .filmstrip-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ---- error toast ---- */
      #error {
        position: fixed;
        bottom: 96px;
        left: 12px;
        z-index: 10;
        max-width: 480px;
        background: #5a2226;
        border: 1px solid #7a3236;
        border-radius: 6px;
        padding: 10px 14px;
      }
      #error[hidden] {
        display: none;
      }
      #error-message {
        margin: 0 0 4px;
      }
      #error-detail {
        margin: 0;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #e0b0b0;
      }
      #error summary {
        cursor: pointer;
        font-size: 11px;
        color: #e0b0b0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button data-module="library" class="active">Library</button>
        <button data-module="develop">Develop</button>
        <span id="brand">Candela</span>
      </header>

      <section id="module-library" class="module">
        <aside class="panel left">
          <div class="panel-header">
            <h2 class="panel-title">Folders</h2>
            <button id="add-folder" title="Add folder">＋</button>
          </div>
          <div id="folder-list"></div>
          <div class="cull-filter">
            <label><input type="checkbox" id="filter-hide-rejected" checked /> Hide rejected</label>
            <label><input type="checkbox" id="filter-picked" /> Picked only</label>
            <label class="cull-filter-row">Min rating
              <select id="filter-min-rating">
                <option value="0" selected>None</option>
                <option value="1">1★</option>
                <option value="2">2★</option>
                <option value="3">3★</option>
                <option value="4">4★</option>
                <option value="5">5★</option>
              </select>
            </label>
          </div>
        </aside>
        <main class="content">
          <div id="library-scroll">
            <div id="library-grid"></div>
          </div>
        </main>
        <aside class="panel right">
          <h2 class="panel-title">Metadata</h2>
          <div id="metadata-panel"></div>
        </aside>
      </section>

      <section id="module-develop" class="module" hidden>
        <aside class="panel left">
          <h2 class="panel-title">History</h2>
          <div id="history-list"></div>
          <div class="history-buttons">
            <button id="undo-btn">Undo</button>
            <button id="redo-btn">Redo</button>
          </div>
          <h2 class="panel-title">Presets</h2>
          <button id="preset-save">Save current…</button>
          <div id="preset-list"></div>
        </aside>
        <main class="content">
          <canvas id="canvas"></canvas>
        </main>
        <aside class="panel right">
          <div id="camera-info" class="camera-info"></div>
          <canvas id="histogram" width="256" height="110"></canvas>
          <details class="panel-section" open>
            <summary>Profile</summary>
            <select id="profile">
              <option value="camera" selected>Camera</option>
              <option value="neutral">Neutral</option>
            </select>
          </details>
          <details class="panel-section" open>
            <summary>White Balance</summary>
            <label class="slider-label" for="wb">Temperature <output id="wb-value" for="wb">5500K</output></label>
            <input type="range" id="wb" min="0" max="480" step="1" value="318" />
            <label class="slider-label" for="tint">Tint <output id="tint-value" for="tint">0</output></label>
            <input type="range" id="tint" min="-150" max="150" step="1" value="0" />
          </details>
          <details class="panel-section" open>
            <summary>Tone</summary>
            <label class="slider-label" for="exposure">Exposure <output id="exposure-value" for="exposure">+0.00</output></label>
            <input type="range" id="exposure" min="-5" max="5" step="0.01" value="0" />
            <label class="slider-label" for="contrast">Contrast <output id="contrast-value" for="contrast">0</output></label>
            <input type="range" id="contrast" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="highlights">Highlights <output id="highlights-value" for="highlights">0</output></label>
            <input type="range" id="highlights" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="shadows">Shadows <output id="shadows-value" for="shadows">0</output></label>
            <input type="range" id="shadows" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="whites">Whites <output id="whites-value" for="whites">0</output></label>
            <input type="range" id="whites" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="blacks">Blacks <output id="blacks-value" for="blacks">0</output></label>
            <input type="range" id="blacks" min="-100" max="100" step="1" value="0" />
          </details>
          <details class="panel-section" open>
            <summary>Presence</summary>
            <label class="slider-label" for="texture">Texture <output id="texture-value" for="texture">0</output></label>
            <input type="range" id="texture" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="clarity">Clarity <output id="clarity-value" for="clarity">0</output></label>
            <input type="range" id="clarity" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="dehaze">Dehaze <output id="dehaze-value" for="dehaze">0</output></label>
            <input type="range" id="dehaze" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="vibrance">Vibrance <output id="vibrance-value" for="vibrance">0</output></label>
            <input type="range" id="vibrance" min="-100" max="100" step="1" value="0" />
            <label class="slider-label" for="saturation">Saturation <output id="saturation-value" for="saturation">0</output></label>
            <input type="range" id="saturation" min="-100" max="100" step="1" value="0" />
          </details>
          <details class="panel-section" open>
            <summary>Tone Curve</summary>
            <div class="curve-header">
              <label class="adjust-label">Adjust
                <select id="curve-adjust">
                  <option value="region" selected>Region</option>
                  <option value="point">Point</option>
                </select>
              </label>
              <button id="curve-reset" type="button" title="Reset the active curve to linear">Reset</button>
            </div>
            <div id="curve-region">
              <label class="slider-label" for="region-highlights">Highlights <output id="region-highlights-value" for="region-highlights">0</output></label>
              <input type="range" id="region-highlights" min="-100" max="100" step="1" value="0" />
              <label class="slider-label" for="region-lights">Lights <output id="region-lights-value" for="region-lights">0</output></label>
              <input type="range" id="region-lights" min="-100" max="100" step="1" value="0" />
              <label class="slider-label" for="region-darks">Darks <output id="region-darks-value" for="region-darks">0</output></label>
              <input type="range" id="region-darks" min="-100" max="100" step="1" value="0" />
              <label class="slider-label" for="region-shadows">Shadows <output id="region-shadows-value" for="region-shadows">0</output></label>
              <input type="range" id="region-shadows" min="-100" max="100" step="1" value="0" />
            </div>
            <div id="curve-point">
              <canvas id="curve" width="240" height="160"></canvas>
            </div>
          </details>
          <details class="panel-section">
            <summary>Export</summary>
            <div class="export-row">
              <select id="export-format">
                <option value="jpeg" selected>JPEG</option>
                <option value="png">PNG</option>
              </select>
              <button id="export-btn">Export</button>
            </div>
          </details>
        </aside>
      </section>

      <footer id="filmstrip">
        <div id="filmstrip-track"></div>
      </footer>

      <div id="error" role="alert" hidden>
        <p id="error-message"></p>
        <details>
          <summary>See detail</summary>
          <pre id="error-detail"></pre>
        </details>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
