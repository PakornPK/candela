<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candela</title>
    <style>
      canvas {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <label for="file">Raw file</label>
      <input type="file" id="file" accept=".dng,.nef,.cr3,.arw,.raf" />
      <canvas id="canvas"></canvas>
      <label>Exposure <input type="range" id="exposure" min="-3" max="3" step="0.1" value="0" /></label>
      <label>White balance <input type="range" id="wb" min="-1" max="1" step="0.05" value="0" /></label>
      <p id="error" role="alert"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
