# Deploy the built static app to GitHub Pages (user.github.io/<repo>/).
# enablement: true is best-effort only: the default GITHUB_TOKEN is rejected by
# POST /pages ("Resource not accessible by integration"), so Pages must be
# enabled once by a repo admin (Settings -> Pages -> Source: GitHub Actions,
# or POST /repos/{owner}/{repo}/pages {"build_type":"workflow"} with a token
# that has admin). After that, every push to main deploys.
# The vendored libraw wasm (src/wasm/) is committed so `npm ci` + build work
# in CI without the emcc/LibRaw native toolchain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
